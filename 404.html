<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | DC-Point</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages SPA Routing Redirection
    // Store original URL path in sessionStorage and redirect to root index.html
    (function() {
      var redirect = window.location.pathname + window.location.search + window.location.hash;
      var pathSegmentsToKeep = 1; // '/DC-Point/' is 1 segment
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      if (repoName === 'DC-Point') {
        sessionStorage.setItem('redirect_path', redirect);
        window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/');
      }
    })();
  </script>
  <style>
    :root {
      --primary-navy: #0B192C;
      --secondary-navy: #1E3E62;
      --accent-teal: #00ADB5;
      --accent-teal-dark: #008B92;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--primary-navy);
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      max-width: 540px;
      width: 100%;
      background: var(--secondary-navy);
      border: 1px solid rgba(0, 173, 181, 0.3);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .badge-404 {
      display: inline-block;
      background: rgba(0, 173, 181, 0.15);
      color: var(--accent-teal);
      border: 1px solid var(--accent-teal);
      padding: 0.35rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent-teal) 0%, var(--accent-teal-dark) 100%);
      color: #FFFFFF;
      font-weight: 700;
      text-decoration: none;
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 173, 181, 0.3);
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 173, 181, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge-404">ERROR 404 • ROUTE UNRESOLVED</div>
    <h1>Page Not Found</h1>
    <p>The page or milestone contract route you are looking for doesn't exist or has moved under DC-Point Escrow Protocol.</p>
    <a href="/DC-Point/" class="btn-home">
      ← Return to DC-Point Marketplace
    </a>
  </div>
</body>
</html>
