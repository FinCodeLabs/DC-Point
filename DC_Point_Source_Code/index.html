<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DC-Point | Escrow-Based E-Marketplace & Legalized Trade Platform</title>
    <meta name="description" content="DC-Point is an escrow-based e-marketplace and legalized trade platform for buying, renting, and trading tech gear, creative assets, and equipment with smart legal agreements and verified milestones." />
    
    <!-- OpenGraph & Social Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DC-Point | Escrow-Based E-Marketplace & Legalized Trade Platform" />
    <meta property="og:description" content="Secure escrow vault trading, automated legal contracts, and verified milestone milestones for buyers, sellers, and renters." />
    <meta property="og:image" content="./hero.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DC-Point | Escrow-Based E-Marketplace & Legalized Trade Platform" />
    <meta name="twitter:description" content="Secure escrow vault trading, automated legal contracts, and verified milestone milestones for buyers, sellers, and renters." />
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0B192C; color: #FFFFFF; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #00ADB5 0%, #10B981 100%); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; box-shadow: 0 0 20px rgba(0, 173, 181, 0.4); margin-bottom: 20px; animation: pulse 1.5s infinite ease-in-out;">
          DC
        </div>
        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: #FFFFFF; letter-spacing: -0.01em;">DC-Point Escrow Platform</h2>
        <p style="font-size: 0.875rem; color: #94A3B8; margin-bottom: 24px;">Initializing secure escrow vault & smart trade engine...</p>
        <div style="width: 160px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden;">
          <div style="width: 50%; height: 100%; background: #00ADB5; border-radius: 999px; animation: loadingBar 1.2s infinite cubic-bezier(0.65, 0, 0.35, 1);"></div>
        </div>
        <style>
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.06); opacity: 0.85; }
          }
          @keyframes loadingBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
